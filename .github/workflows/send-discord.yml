name: Send Market Report to Discord

on:
  push:
    paths:
      - 'reports/**'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send report to Discord
        run: |
          # Find today's report, or fall back to the most recent one
          TODAY=$(date +%Y%m%d)
          REPORT=$(git ls-tree -r HEAD --name-only | grep "^reports/.*${TODAY}" | sort -r | head -1)
          if [ -z "$REPORT" ]; then
            REPORT=$(git ls-tree -r HEAD --name-only | grep "^reports/" | sort -r | head -1)
          fi
          if [ -z "$REPORT" ]; then
            echo "No report found."
            exit 1
          fi
          echo "Sending report: $REPORT"

          # Route to correct channel based on filename
          if echo "$REPORT" | grep -q "premarket"; then
            WEBHOOK="$DISCORD_WEBHOOK_PREMARKET"
          else
            WEBHOOK="$DISCORD_WEBHOOK_POSTMARKET"
          fi

          if [ -z "$WEBHOOK" ]; then
            echo "ERROR: Webhook URL is empty. Check GitHub secret names."
            exit 1
          fi
          echo "Webhook URL length: ${#WEBHOOK} chars"

          CONTENT=$(cat "$REPORT")
          TOTAL=${#CONTENT}
          OFFSET=0
          CHUNK_SIZE=1900

          while [ $OFFSET -lt $TOTAL ]; do
            CHUNK="${CONTENT:$OFFSET:$CHUNK_SIZE}"
            OFFSET=$((OFFSET + CHUNK_SIZE))
            PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'content': sys.argv[1]}))" "$CHUNK")
            curl -s -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$WEBHOOK"
            sleep 1
          done
        env:
          DISCORD_WEBHOOK_PREMARKET: ${{ secrets.DISCORD_WEBHOOK_PREMARKET }}
          DISCORD_WEBHOOK_POSTMARKET: ${{ secrets.DISCORD_WEBHOOK_POSTMARKET }}
