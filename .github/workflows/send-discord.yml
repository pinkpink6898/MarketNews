name: Send Market Report to Discord

on:
  push:
    branches:
      - main
    paths:
      - 'reports/**'
  workflow_call:
    inputs:
      report_files:
        description: >
          Newline-separated report file paths to send. If omitted, the
          files to send are derived from the triggering push's diff.
        required: false
        type: string
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send report(s) to Discord
        run: |
          send_report() {
            REPORT="$1"
            if echo "$REPORT" | grep -q "premarket"; then
              WEBHOOK="$DISCORD_WEBHOOK_PREMARKET"
            else
              WEBHOOK="$DISCORD_WEBHOOK_POSTMARKET"
            fi

            if [ -z "$WEBHOOK" ]; then
              echo "ERROR: Webhook URL is empty for $REPORT. Check GitHub secret names."
              return 1
            fi

            if [ ! -f "$REPORT" ]; then
              echo "ERROR: $REPORT not found in checked-out tree."
              return 1
            fi

            CONTENT=$(cat "$REPORT")
            TOTAL=${#CONTENT}
            OFFSET=0
            CHUNK_SIZE=1900
            FAILED=0

            while [ $OFFSET -lt $TOTAL ]; do
              CHUNK="${CONTENT:$OFFSET:$CHUNK_SIZE}"
              OFFSET=$((OFFSET + CHUNK_SIZE))
              PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'content': sys.argv[1]}))" "$CHUNK")
              HTTP_CODE=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$WEBHOOK")
              echo "[$REPORT] Discord response: $HTTP_CODE"
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "ERROR: Discord webhook returned $HTTP_CODE for $REPORT"
                cat /tmp/discord_response.txt
                FAILED=1
              fi
              sleep 1
            done

            return $FAILED
          }

          # When called directly (workflow_call, e.g. from auto-merge-reports.yml)
          # the caller already knows exactly which files it merged — use that
          # instead of re-deriving from a push diff that may not exist in this
          # invocation. Otherwise fall back to diffing the triggering push, since
          # re-deriving "the" report from the whole tree would make a same-day
          # premarket + postmarket pair always resolve to whichever filename
          # sorts alphabetically last ("premarket" > "postmarket").
          INPUT_FILES="${{ inputs.report_files }}"
          if [ -n "$INPUT_FILES" ]; then
            echo "Using explicitly provided report file list."
            CHANGED="$INPUT_FILES"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git show --name-only --diff-filter=AM --pretty=format: HEAD -- reports/ | grep -v '^$' || true)
            else
              CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" HEAD -- reports/ || true)
            fi

            if [ -z "$CHANGED" ]; then
              echo "No changed report files detected in this push; falling back to most recent."
              CHANGED=$(git ls-tree -r HEAD --name-only | grep "^reports/" | sort -r | head -1)
            fi
          fi

          if [ -z "$CHANGED" ]; then
            echo "No report found."
            exit 1
          fi

          echo "Reports to send:"
          echo "$CHANGED"

          OVERALL_FAILED=0
          for REPORT in $CHANGED; do
            echo "Sending report: $REPORT"
            send_report "$REPORT" || OVERALL_FAILED=1
          done

          if [ "$OVERALL_FAILED" -eq 1 ]; then
            echo "One or more reports failed to send to Discord."
            exit 1
          fi
        env:
          DISCORD_WEBHOOK_PREMARKET: ${{ secrets.DISCORD_WEBHOOK_PREMARKET }}
          DISCORD_WEBHOOK_POSTMARKET: ${{ secrets.DISCORD_WEBHOOK_POSTMARKET }}
